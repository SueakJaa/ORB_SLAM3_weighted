# Item B (a trigger that needs no YOLO) - DEVELOPMENT set only.
# Bonn: three sequences never used before (the 10 Bonn sequences in bonn_baseline are the TEST set and stay
# untouched). moving_obstructing_box2 / synchronous2 match the two test sequences that still fail
# (a box YOLO does not know; people jumping in sync); crowd3 checks a normal crowd.
# 18 Nov: + placing_obstructing_box / removing_obstructing_box (also unused): first runs showed GEOK2Z_MF
# already solves synchronous2 and crowd3, so the open problem is a large object YOLO does not know - three
# box sequences instead of one, so the trigger is not tuned to a single video.
# TUM: negatives (fr1_room, fr1_desk: nobody moves; sitting_xyz: seated people) and positives (walking).
#
# 1) offline scan with ground-truth poses (no SLAM runs needed, a few minutes):
#      python3 scripts/itemb/depth_motion_scan.py scripts/itemb/itemb_dev.yaml
# 2) the realistic case, poses from the system itself (1 run each, ~15 min, per-frame logs on):
#      python3 scripts/eval/run_experiments.py scripts/itemb/itemb_dev.yaml
#      python3 scripts/eval/evaluate.py        scripts/itemb/itemb_dev.yaml
#      python3 scripts/eval/report.py          scripts/itemb/itemb_dev.yaml
#      python3 scripts/itemb/depth_motion_scan.py scripts/itemb/itemb_dev.yaml --pose A0_orbslam3
#      python3 scripts/itemb/depth_motion_scan.py scripts/itemb/itemb_dev.yaml --pose GEOK2Z_MF
name: itemb_dev
runs: 1
orbslam_root: ~/ORB_SLAM3
data_root: ~/datasets
results_root: results
fail_threshold_m: 0.1
bonn_gt: bonn_tm

common_env:
  DSLAM_MODE: baseline
  DSLAM_CHI2_GATE: raw
  DSLAM_LABELS: opt
  DSLAM_KERNEL: huber
  DSLAM_IGNORE: ""
  DSLAM_KF_SEMANTIC: 0
  DSLAM_DIAG: 1
  DSLAM_KF_CAP_BYPASS: 0

baseline: A0_orbslam3
variants:
  A0_orbslam3:  {DSLAM_KF_SWITCH: 0, DSLAM_KF_MIN_GAP: 0, DSLAM_MAP_FILTER: 0}
  GEOK2Z_MF:    {DSLAM_KF_SWITCH: 1, DSLAM_KF_MIN_GAP: 10,
                 DSLAM_KF_SWITCH_GEO: 0.3, DSLAM_KF_SWITCH_GEO_Z: 3.09, DSLAM_KF_SWITCH_GEO_KEEP: 150,
                 DSLAM_KF_SWITCH_GEO_MINCONF: 2,
                 DSLAM_MAP_FILTER: 2, DSLAM_MAP_FILTER_DEPTH: 0.5, DSLAM_MAP_FILTER_SITES: 3, DSLAM_MAP_FILTER_INIT: -1}

sequences:
  - bonn_moving_obstructing_box2
  - bonn_placing_obstructing_box
  - bonn_removing_obstructing_box
  - bonn_synchronous2
  - bonn_crowd3
  - freiburg3_walking_xyz
  - freiburg3_walking_rpy
  - freiburg3_sitting_xyz
  - freiburg1_room
  - freiburg1_desk
