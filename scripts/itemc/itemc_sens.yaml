# Item C: sensitivity of the final method (GEOK2Z_MF) to each of its 8 thresholds, one at a time.
# Each variant changes ONE value; everything else stays at the final setting (variant DEFAULT).
# Development sequences only (TUM + the unused Bonn crowd3); the Bonn test set is not touched.
# Generated by scripts/itemc/make_config.py. 24 variants, 6 sequences, 3 runs = 432 runs (~8 h).
#   python3 scripts/eval/run_experiments.py scripts/itemc/itemc_sens.yaml --dry-run
#   python3 scripts/eval/run_experiments.py scripts/itemc/itemc_sens.yaml
#   python3 scripts/eval/evaluate.py        scripts/itemc/itemc_sens.yaml
#   python3 scripts/itemc/sensitivity.py    scripts/itemc/itemc_sens.yaml
# Parameters (default in brackets):
#   YMIN  DSLAM_KF_SWITCH_MIN          share of keypoints in YOLO boxes for a hit [0.05]; tried [0.02, 0.1]
#   GEO   DSLAM_KF_SWITCH_GEO          min outlier ratio inside the box [0.3]; tried [0.2, 0.25, 0.4, 0.5]
#   Z     DSLAM_KF_SWITCH_GEO_Z        z-test level (1.64 p<.05, 2.33 .01, 3.72 1e-4, 4.26 1e-5) [3.09]; tried [1.64, 2.33, 3.72, 4.26]
#   CONF  DSLAM_KF_SWITCH_GEO_MINCONF  confirmations before the long hold [2]; tried [1, 3]
#   HOLD  DSLAM_KF_SWITCH_HOLD         short hold [frames] [30]; tried [15, 60]
#   KEEP  DSLAM_KF_SWITCH_GEO_KEEP     long hold [frames] [150]; tried [75, 300]
#   GAP   DSLAM_KF_MIN_GAP             keyframe cap: min frames between keyframes [10]; tried [5, 8, 15, 20]
#   BAND  DSLAM_MAP_FILTER_DEPTH       map filter depth band [m] [0.5]; tried [0.25, 0.75, 1.0]
name: itemc_sens
runs: 3
orbslam_root: ~/ORB_SLAM3
data_root: ~/datasets
results_root: results
fail_threshold_m: 0.1
bonn_gt: bonn_tm

common_env:
  DSLAM_MODE: baseline
  DSLAM_CHI2_GATE: raw
  DSLAM_LABELS: opt
  DSLAM_KERNEL: huber
  DSLAM_IGNORE: ""
  DSLAM_KF_SEMANTIC: 0
  DSLAM_DIAG: 0
  DSLAM_KF_CAP_BYPASS: 0

