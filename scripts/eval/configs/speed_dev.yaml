# Speed follow-up (26 Nov). On the Bonn test set, parallel YOLO (GEOK2Z_MF_PAR) matched serial GEOK2Z_MF on
# 21/22 sequences but crowd2 failures rose 1 -> 4 of 10 (Fisher p ~ 0.30), so by the pre-set rule it was not
# adopted. Question: is that chance, or does running at camera speed hurt crowded scenes?
# Suspected mechanism: rgbd_tum only sleeps when a frame is faster than the camera interval. Serial (~37-46 ms)
# is slower than 33 ms, so the run stretches and local mapping gets more time per frame; parallel (~27-31 ms)
# keeps pace and loses that extra time.
# Development sequences only (never used for test decisions): crowd3, synchronous2 (people, fast motion).
# Both variants also use the new fast pre-processing (identical network input, checked at load).
#
# Decision rule, fixed before running: if PAR has >= 2 more failures than serial on either sequence, or is
# significantly worse (Mann-Whitney, Holm) on either, the crowd2 result is treated as a real cost of running at
# camera speed and parallel stays a speed option only. Otherwise crowd2 is reported as most likely chance.
#   python3 scripts/eval/run_experiments.py scripts/eval/configs/speed_dev.yaml
#   python3 scripts/eval/evaluate.py scripts/eval/configs/speed_dev.yaml
#   python3 scripts/eval/report.py scripts/eval/configs/speed_dev.yaml
name: speed_dev
bonn_gt: bonn_tm
runs: 10
orbslam_root: ~/ORB_SLAM3
data_root: ~/datasets
results_root: results
fail_threshold_m: 0.1

common_env:
  DSLAM_MODE: baseline
  DSLAM_CHI2_GATE: raw
  DSLAM_LABELS: opt
  DSLAM_KERNEL: huber
  DSLAM_IGNORE: ""
  DSLAM_KF_SEMANTIC: 0
  DSLAM_DIAG: 0
  DSLAM_KF_CAP_BYPASS: 0

baseline: GEOK2Z_MF
variants:
  GEOK2Z_MF:     {DSLAM_KF_SWITCH: 1, DSLAM_KF_MIN_GAP: 10,
                  DSLAM_KF_SWITCH_GEO: 0.3, DSLAM_KF_SWITCH_GEO_Z: 3.09, DSLAM_KF_SWITCH_GEO_KEEP: 150,
                  DSLAM_KF_SWITCH_GEO_MINCONF: 2,
                  DSLAM_MAP_FILTER: 2, DSLAM_MAP_FILTER_DEPTH: 0.5, DSLAM_MAP_FILTER_SITES: 3, DSLAM_MAP_FILTER_INIT: -1}
  GEOK2Z_MF_PAR: {DSLAM_KF_SWITCH: 1, DSLAM_KF_MIN_GAP: 10,
                  DSLAM_KF_SWITCH_GEO: 0.3, DSLAM_KF_SWITCH_GEO_Z: 3.09, DSLAM_KF_SWITCH_GEO_KEEP: 150,
                  DSLAM_KF_SWITCH_GEO_MINCONF: 2,
                  DSLAM_MAP_FILTER: 2, DSLAM_MAP_FILTER_DEPTH: 0.5, DSLAM_MAP_FILTER_SITES: 3, DSLAM_MAP_FILTER_INIT: -1,
                  DSLAM_YOLO_PARALLEL: 1}
sequences:
  - bonn_crowd3
  - bonn_synchronous2
