# v20: count-aware geometric check. On fr1_room the switch fired on a STANDING person (legs next to the
# cabinet, ~25-29 s): only 10-20 points in the box and a high outlier ratio everywhere (fast motion), so
# "inside >= outside + 0.2" passed by chance, the cap blocked keyframes and tracking was lost for ~3 s
# (diag_fr1room, switch_diag.py). GEOK2Z_MF replaces the fixed +0.2 margin by a one-sided two-proportion
# z-test at p < 0.001 (z >= 3.09). Offline replay (trigger_replay.py): fr1_room 4.2 -> 0.0 % switch-on,
# fr1_360 9.5 -> 6.0 %, walking_xyz 84.6 -> 84.5 %, walking_rpy 79.8 -> 81.0 %.
#
# A0_orbslam3 and GEOK2_MF are copied from thesis_final (same code path: GEO_Z=0 is the old rule),
# only GEOK2Z_MF is run (12 sequences x 10 runs = 120 runs). From ~/ORB_SLAM3:
#   for s in results/thesis_final/freiburg*; do q=$(basename $s); mkdir -p results/thesis_z/$q
#     for v in A0_orbslam3 GEOK2_MF; do [ -d $s/$v ] && cp -rn $s/$v results/thesis_z/$q/; done; done
#   python3 scripts/eval/run_experiments.py scripts/eval/configs/thesis_z.yaml --dry-run   # 120 runs
#   python3 scripts/eval/run_experiments.py scripts/eval/configs/thesis_z.yaml
#   python3 scripts/eval/evaluate.py        scripts/eval/configs/thesis_z.yaml
#   python3 scripts/eval/report.py          scripts/eval/configs/thesis_z.yaml
name: thesis_z
runs: 10
orbslam_root: ~/ORB_SLAM3
data_root: ~/datasets
results_root: results
fail_threshold_m: 0.1

common_env:
  DSLAM_MODE: baseline
  DSLAM_CHI2_GATE: raw
  DSLAM_LABELS: opt
  DSLAM_KERNEL: huber
  DSLAM_IGNORE: ""
  DSLAM_KF_SEMANTIC: 0
  DSLAM_DIAG: 0
  DSLAM_KF_CAP_BYPASS: 0

baseline: A0_orbslam3
variants:
  A0_orbslam3:  {DSLAM_KF_SWITCH: 0, DSLAM_KF_MIN_GAP: 0, DSLAM_MAP_FILTER: 0}
  GEOK2_MF:     {DSLAM_KF_SWITCH: 1, DSLAM_KF_MIN_GAP: 10,
                 DSLAM_KF_SWITCH_GEO: 0.3, DSLAM_KF_SWITCH_GEO_REL: 0.2, DSLAM_KF_SWITCH_GEO_KEEP: 150,
                 DSLAM_KF_SWITCH_GEO_MINCONF: 2,
                 DSLAM_MAP_FILTER: 2, DSLAM_MAP_FILTER_DEPTH: 0.5, DSLAM_MAP_FILTER_SITES: 3, DSLAM_MAP_FILTER_INIT: -1}
  GEOK2Z_MF:    {DSLAM_KF_SWITCH: 1, DSLAM_KF_MIN_GAP: 10,
                 DSLAM_KF_SWITCH_GEO: 0.3, DSLAM_KF_SWITCH_GEO_Z: 3.09, DSLAM_KF_SWITCH_GEO_KEEP: 150,
                 DSLAM_KF_SWITCH_GEO_MINCONF: 2,
                 DSLAM_MAP_FILTER: 2, DSLAM_MAP_FILTER_DEPTH: 0.5, DSLAM_MAP_FILTER_SITES: 3, DSLAM_MAP_FILTER_INIT: -1}

  # v21b: + per-point depth test, two views (thesis_a: better than GEOK2Z_MF on sitting, never worse on walking)
  GEOK2Z_MFD30V2: {DSLAM_KF_SWITCH: 1, DSLAM_KF_MIN_GAP: 10,
                 DSLAM_KF_SWITCH_GEO: 0.3, DSLAM_KF_SWITCH_GEO_Z: 3.09, DSLAM_KF_SWITCH_GEO_KEEP: 150,
                 DSLAM_KF_SWITCH_GEO_MINCONF: 2,
                 DSLAM_MAP_FILTER: 2, DSLAM_MAP_FILTER_DEPTH: 0.5, DSLAM_MAP_FILTER_SITES: 3, DSLAM_MAP_FILTER_INIT: -1,
                 DSLAM_MAP_DEPTH_TEST: 1, DSLAM_MAP_DEPTH_GAP: 30, DSLAM_MAP_DEPTH_VIEWS: 2}
sequences:
  - freiburg3_walking_xyz
  - freiburg3_walking_static
  - freiburg3_walking_halfsphere
  - freiburg3_walking_rpy
  - freiburg3_sitting_xyz
  - freiburg3_sitting_static
  - freiburg3_sitting_halfsphere
  - freiburg2_desk_with_person
  - freiburg1_room
  - freiburg1_desk
  - freiburg1_desk2
  - freiburg1_360
