# v19e: where does the map filter help (rpy) and where does it cost (xyz)?
# v19d diagnostics: the filter keeps ~80 close points per new keyframe out of the map (Tracking) but only
# 6-8 % of LocalMapping triangulations; on walking_xyz tracking gets thinner (frames < 100 tracked points
# 3 % -> 9 %). Ablation: filter only at keyframe creation (sites 1), only in triangulation (sites 2),
# both (3), and a smaller depth margin.
name: v19e_filter_sites
runs: 5
orbslam_root: ~/ORB_SLAM3
data_root: ~/datasets
results_root: results
fail_threshold_m: 0.1

common_env:
  DSLAM_MODE: baseline
  DSLAM_CHI2_GATE: raw
  DSLAM_LABELS: opt
  DSLAM_KERNEL: huber
  DSLAM_IGNORE: ""
  DSLAM_KF_SEMANTIC: 0
  DSLAM_DIAG: 0
  DSLAM_KF_SWITCH: 1
  DSLAM_KF_MIN_GAP: 10
  DSLAM_KF_SWITCH_GEO: 0.3
  DSLAM_KF_SWITCH_GEO_REL: 0.2
  DSLAM_KF_SWITCH_GEO_KEEP: 150
  DSLAM_KF_SWITCH_GEO_MINCONF: 2
  DSLAM_KF_CAP_BYPASS: 0

baseline: GEOK2_G10
# DSLAM_MAP_FILTER_INIT: 1 = how these variants ran (before v19f the filter always touched the initial map)
variants:
  GEOK2_G10:      {DSLAM_MAP_FILTER: 0}
  MFD05_both:     {DSLAM_MAP_FILTER: 2, DSLAM_MAP_FILTER_DEPTH: 0.5, DSLAM_MAP_FILTER_SITES: 3, DSLAM_MAP_FILTER_INIT: 1}
  MFD05_track:    {DSLAM_MAP_FILTER: 2, DSLAM_MAP_FILTER_DEPTH: 0.5, DSLAM_MAP_FILTER_SITES: 1, DSLAM_MAP_FILTER_INIT: 1}
  MFD05_mapping:  {DSLAM_MAP_FILTER: 2, DSLAM_MAP_FILTER_DEPTH: 0.5, DSLAM_MAP_FILTER_SITES: 2, DSLAM_MAP_FILTER_INIT: 1}
  MFD025_both:    {DSLAM_MAP_FILTER: 2, DSLAM_MAP_FILTER_DEPTH: 0.25, DSLAM_MAP_FILTER_SITES: 3, DSLAM_MAP_FILTER_INIT: 1}

sequences:
  - freiburg3_walking_xyz
  - freiburg3_walking_rpy
  - freiburg3_walking_halfsphere
  - freiburg3_walking_static
