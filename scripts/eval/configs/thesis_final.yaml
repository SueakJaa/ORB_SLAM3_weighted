# Final comparison for the thesis: one experiment folder with the four methods that matter.
# Filled by copying finished runs (see below) - the runner only runs what is still missing.
#   A0_orbslam3  plain ORB-SLAM3                                   (runs from thesis_main)
#   SW_G10       keyframe cap switched by YOLO only                (runs from thesis_main)
#   GEOK2_G10    + semantic-geometric switch (v18)                 (runs from thesis_v19)
#   GEOK2_MF     + confirmed-moving people kept out of the map     (runs from thesis_v19) = final method
#
# Fill it (from ~/ORB_SLAM3):
#   for s in results/thesis_main/freiburg*; do q=$(basename $s); mkdir -p results/thesis_final/$q
#     for v in A0_orbslam3 SW_G10; do [ -d $s/$v ] && cp -rn $s/$v results/thesis_final/$q/; done; done
#   for s in results/thesis_v19/freiburg*; do q=$(basename $s); mkdir -p results/thesis_final/$q
#     for v in GEOK2_G10 GEOK2_MF; do [ -d $s/$v ] && cp -rn $s/$v results/thesis_final/$q/; done; done
#   python3 scripts/eval/run_experiments.py scripts/eval/configs/thesis_final.yaml --dry-run   # should be 0
#   python3 scripts/eval/evaluate.py scripts/eval/configs/thesis_final.yaml
#   python3 scripts/eval/report.py   scripts/eval/configs/thesis_final.yaml
name: thesis_final
runs: 10
orbslam_root: ~/ORB_SLAM3
data_root: ~/datasets
results_root: results
fail_threshold_m: 0.1

common_env:
  DSLAM_MODE: baseline
  DSLAM_CHI2_GATE: raw
  DSLAM_LABELS: opt
  DSLAM_KERNEL: huber
  DSLAM_IGNORE: ""
  DSLAM_KF_SEMANTIC: 0
  DSLAM_DIAG: 0
  DSLAM_KF_CAP_BYPASS: 0

baseline: A0_orbslam3
variants:
  A0_orbslam3:  {DSLAM_KF_SWITCH: 0, DSLAM_KF_MIN_GAP: 0, DSLAM_MAP_FILTER: 0}
  SW_G10:       {DSLAM_KF_SWITCH: 1, DSLAM_KF_MIN_GAP: 10, DSLAM_MAP_FILTER: 0}
  GEOK2_G10:    {DSLAM_KF_SWITCH: 1, DSLAM_KF_MIN_GAP: 10, DSLAM_MAP_FILTER: 0,
                 DSLAM_KF_SWITCH_GEO: 0.3, DSLAM_KF_SWITCH_GEO_REL: 0.2, DSLAM_KF_SWITCH_GEO_KEEP: 150,
                 DSLAM_KF_SWITCH_GEO_MINCONF: 2}
  GEOK2_MF:     {DSLAM_KF_SWITCH: 1, DSLAM_KF_MIN_GAP: 10,
                 DSLAM_KF_SWITCH_GEO: 0.3, DSLAM_KF_SWITCH_GEO_REL: 0.2, DSLAM_KF_SWITCH_GEO_KEEP: 150,
                 DSLAM_KF_SWITCH_GEO_MINCONF: 2,
                 DSLAM_MAP_FILTER: 2, DSLAM_MAP_FILTER_DEPTH: 0.5, DSLAM_MAP_FILTER_SITES: 3, DSLAM_MAP_FILTER_INIT: -1}

sequences:
  - freiburg3_walking_xyz
  - freiburg3_walking_static
  - freiburg3_walking_halfsphere
  - freiburg3_walking_rpy
  - freiburg3_sitting_xyz
  - freiburg3_sitting_static
  - freiburg3_sitting_halfsphere
  - freiburg2_desk_with_person
  - freiburg1_room
  - freiburg1_desk
  - freiburg1_desk2
  - freiburg1_360
