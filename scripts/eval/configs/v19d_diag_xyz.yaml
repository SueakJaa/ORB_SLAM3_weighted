# v19d: why does the map filter hurt walking_xyz? Per-frame diagnostics (DSLAM_DIAG=1) for the method
# with and without the depth-limited map filter, on walking_xyz (hurt) and walking_rpy (helped).
# Afterwards: python3 scripts/eval/diag_compare.py scripts/eval/configs/v19d_diag_xyz.yaml
name: v19d_diag_xyz
runs: 3
orbslam_root: ~/ORB_SLAM3
data_root: ~/datasets
results_root: results
fail_threshold_m: 0.1

common_env:
  DSLAM_MODE: baseline
  DSLAM_CHI2_GATE: raw
  DSLAM_LABELS: opt
  DSLAM_KERNEL: huber
  DSLAM_IGNORE: ""
  DSLAM_KF_SEMANTIC: 0
  DSLAM_DIAG: 1                  # writes diag_frames.csv into every run folder
  DSLAM_KF_SWITCH: 1
  DSLAM_KF_MIN_GAP: 10
  DSLAM_KF_SWITCH_GEO: 0.3
  DSLAM_KF_SWITCH_GEO_REL: 0.2
  DSLAM_KF_SWITCH_GEO_KEEP: 150
  DSLAM_KF_SWITCH_GEO_MINCONF: 2
  DSLAM_KF_CAP_BYPASS: 0

baseline: GEOK2_G10
variants:
  GEOK2_G10:    {DSLAM_MAP_FILTER: 0}
  GEOK2_MFD05:  {DSLAM_MAP_FILTER: 2, DSLAM_MAP_FILTER_DEPTH: 0.5}

sequences:
  - freiburg3_walking_xyz
  - freiburg3_walking_rpy
