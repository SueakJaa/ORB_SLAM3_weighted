# Main comparison for the thesis: baseline vs. YOLO-only switch vs. final method (GEOK2_G10, v18).
# Same commands as baseline_tum_dynamic.yaml, with this file.
name: thesis_main
runs: 10
orbslam_root: ~/ORB_SLAM3
data_root: ~/datasets
results_root: results
fail_threshold_m: 0.1
rpe_delta: 1.0
rpe_delta_unit: s

common_env:
  DSLAM_MODE: baseline
  DSLAM_CHI2_GATE: raw
  DSLAM_LABELS: opt
  DSLAM_KERNEL: huber
  DSLAM_MAP_FILTER: 0
  DSLAM_IGNORE: ""
  DSLAM_KF_SEMANTIC: 0
  DSLAM_DIAG: 0

baseline: A0_orbslam3
variants:
  A0_orbslam3:   {DSLAM_KF_SWITCH: 0, DSLAM_KF_MIN_GAP: 0}
  SW_G10:        {DSLAM_KF_SWITCH: 1, DSLAM_KF_MIN_GAP: 10}
  GEOK2_G10:     {DSLAM_KF_SWITCH: 1, DSLAM_KF_MIN_GAP: 10, DSLAM_KF_SWITCH_GEO: 0.3, DSLAM_KF_SWITCH_GEO_REL: 0.2,
                  DSLAM_KF_SWITCH_GEO_KEEP: 150, DSLAM_KF_SWITCH_GEO_MINCONF: 2}

sequences:
  - freiburg3_walking_xyz
  - freiburg3_walking_static
  - freiburg3_walking_halfsphere
  - freiburg3_walking_rpy
  - freiburg3_sitting_xyz
  - freiburg3_sitting_static
  - freiburg3_sitting_halfsphere
  - freiburg2_desk_with_person
  - freiburg1_room
  - freiburg1_desk
  - freiburg1_desk2
  - freiburg1_360
