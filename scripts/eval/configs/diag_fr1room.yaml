# Step 0 of the development plan: why is GEOK2_MF worse than ORB-SLAM3 on fr1_room (0.082 vs 0.072 m,
# 2/10 failed)? fr1_room has no moving people, so the map filter should only act if the switch fires
# by mistake. Per-frame diagnostics (DSLAM_DIAG=1) for the method with and without the map filter on
# fr1_room, two other people-free sequences (fr1_desk, fr1_360) and one positive control (walking_xyz).
# 4 sequences x 2 variants x 5 runs = 40 runs, about 1 hour.
#   python3 scripts/eval/run_experiments.py scripts/eval/configs/diag_fr1room.yaml
#   python3 scripts/eval/evaluate.py        scripts/eval/configs/diag_fr1room.yaml
#   python3 scripts/eval/switch_diag.py     scripts/eval/configs/diag_fr1room.yaml
name: diag_fr1room
runs: 5
orbslam_root: ~/ORB_SLAM3
data_root: ~/datasets
results_root: results
fail_threshold_m: 0.1

common_env:
  DSLAM_MODE: baseline
  DSLAM_CHI2_GATE: raw
  DSLAM_LABELS: opt
  DSLAM_KERNEL: huber
  DSLAM_IGNORE: ""
  DSLAM_KF_SEMANTIC: 0
  DSLAM_DIAG: 1                  # writes diag_frames.csv into every run folder
  DSLAM_KF_CAP_BYPASS: 0
  DSLAM_KF_SWITCH: 1
  DSLAM_KF_MIN_GAP: 10
  DSLAM_KF_SWITCH_GEO: 0.3
  DSLAM_KF_SWITCH_GEO_REL: 0.2
  DSLAM_KF_SWITCH_GEO_KEEP: 150
  DSLAM_KF_SWITCH_GEO_MINCONF: 2

baseline: GEOK2_G10
variants:
  GEOK2_G10:  {DSLAM_MAP_FILTER: 0}
  GEOK2_MF:   {DSLAM_MAP_FILTER: 2, DSLAM_MAP_FILTER_DEPTH: 0.5, DSLAM_MAP_FILTER_SITES: 3, DSLAM_MAP_FILTER_INIT: -1}

sequences:
  - freiburg1_room
  - freiburg1_desk
  - freiburg1_360
  - freiburg3_walking_xyz
