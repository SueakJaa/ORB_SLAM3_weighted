# v20 step 1b: baseline on the Bonn RGB-D Dynamic Dataset (Palazzolo et al., IROS 2019).
# Download first:  bash scripts/eval/download_bonn.sh   (sequences below, about 7 GB)
# Moving people (crowd, person_tracking, synchronous) AND moving objects YOLO does not know (balloons,
# boxes): there our switch can only react to people, so these sequences show the method's limit.
# Ground truth: groundtruth.txt is the motion-capture MARKER pose (axis-swapped). bonn_gt converts it to the
# camera pose with the dataset's calibration (camera = T_ros * G * T_ros * T_m); without it, RPE rotation is
# meaningless (20-60 deg/s on good runs) and ATE carries a ~2 cm marker offset. Check with bonn_gt_check.py.
# bonn_gt: none | bonn_tm | bonn_tm_inv
name: bonn_baseline
bonn_gt: bonn_tm
runs: 5
orbslam_root: ~/ORB_SLAM3
data_root: ~/datasets
results_root: results
fail_threshold_m: 0.1

common_env:
  DSLAM_MODE: baseline
  DSLAM_CHI2_GATE: raw
  DSLAM_LABELS: opt
  DSLAM_KERNEL: huber
  DSLAM_IGNORE: ""
  DSLAM_KF_SEMANTIC: 0
  DSLAM_DIAG: 0
  DSLAM_KF_CAP_BYPASS: 0

baseline: A0_orbslam3
variants:
  A0_orbslam3:  {DSLAM_KF_SWITCH: 0, DSLAM_KF_MIN_GAP: 0, DSLAM_MAP_FILTER: 0}
  SW_G10:       {DSLAM_KF_SWITCH: 1, DSLAM_KF_MIN_GAP: 10, DSLAM_MAP_FILTER: 0}
  GEOK2_G10:    {DSLAM_KF_SWITCH: 1, DSLAM_KF_MIN_GAP: 10, DSLAM_MAP_FILTER: 0,
                 DSLAM_KF_SWITCH_GEO: 0.3, DSLAM_KF_SWITCH_GEO_REL: 0.2, DSLAM_KF_SWITCH_GEO_KEEP: 150,
                 DSLAM_KF_SWITCH_GEO_MINCONF: 2}
  GEOK2_MF:     {DSLAM_KF_SWITCH: 1, DSLAM_KF_MIN_GAP: 10,
                 DSLAM_KF_SWITCH_GEO: 0.3, DSLAM_KF_SWITCH_GEO_REL: 0.2, DSLAM_KF_SWITCH_GEO_KEEP: 150,
                 DSLAM_KF_SWITCH_GEO_MINCONF: 2,
                 DSLAM_MAP_FILTER: 2, DSLAM_MAP_FILTER_DEPTH: 0.5, DSLAM_MAP_FILTER_SITES: 3, DSLAM_MAP_FILTER_INIT: -1}

sequences:
  - bonn_balloon
  - bonn_balloon2
  - bonn_crowd
  - bonn_crowd2
  - bonn_person_tracking
  - bonn_person_tracking2
  - bonn_moving_nonobstructing_box
  - bonn_moving_obstructing_box
  - bonn_synchronous
  - bonn_static
