# v19b: keep confirmed-moving people out of the map (point-level), alone and with the cap bypass.
# v19 showed: letting keyframes through during fast rotation keeps tracking alive (100 %) but the new
# keyframes carry people into the map, so ATE gets worse. Here the points inside confirmed boxes are not
# turned into map points (DSLAM_MAP_FILTER=2: only while the switch is on), so extra keyframes stay clean.
name: v19b_map_filter
runs: 5
orbslam_root: ~/ORB_SLAM3
data_root: ~/datasets
results_root: results
fail_threshold_m: 0.1

common_env:
  DSLAM_MODE: baseline
  DSLAM_CHI2_GATE: raw
  DSLAM_LABELS: opt
  DSLAM_KERNEL: huber
  DSLAM_IGNORE: ""
  DSLAM_KF_SEMANTIC: 0
  DSLAM_DIAG: 0
  DSLAM_KF_SWITCH: 1
  DSLAM_KF_MIN_GAP: 10
  DSLAM_KF_SWITCH_GEO: 0.3
  DSLAM_KF_SWITCH_GEO_REL: 0.2
  DSLAM_KF_SWITCH_GEO_KEEP: 150
  DSLAM_KF_SWITCH_GEO_MINCONF: 2

baseline: GEOK2_G10
variants:
  GEOK2_G10:      {DSLAM_MAP_FILTER: 0, DSLAM_KF_CAP_BYPASS: 0}
  GEOK2_MF:       {DSLAM_MAP_FILTER: 2, DSLAM_KF_CAP_BYPASS: 0}
  GEOK2_MF_B50:   {DSLAM_MAP_FILTER: 2, DSLAM_KF_CAP_BYPASS: 50}
  GEOK2_MF_B80:   {DSLAM_MAP_FILTER: 2, DSLAM_KF_CAP_BYPASS: 80}

sequences:
  - freiburg3_walking_rpy
  - freiburg3_walking_halfsphere
  - freiburg3_walking_xyz
  - freiburg3_walking_static
  - freiburg1_room
