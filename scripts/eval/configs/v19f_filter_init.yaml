# v19f: is the walking_xyz cost of the map filter caused by filtering the INITIAL map?
# In the v19d diagnostics (walking_xyz) the filtered run starts with ~420 instead of ~700 map points and has a
# 0.22-0.27 m error in the first 0.5 s, then behaves like the unfiltered run. Every filtered variant so far
# also filtered the initial map (before the switch could confirm anything). A/B with DSLAM_MAP_FILTER_INIT.
name: v19f_filter_init
runs: 5
orbslam_root: ~/ORB_SLAM3
data_root: ~/datasets
results_root: results
fail_threshold_m: 0.1

common_env:
  DSLAM_MODE: baseline
  DSLAM_CHI2_GATE: raw
  DSLAM_LABELS: opt
  DSLAM_KERNEL: huber
  DSLAM_IGNORE: ""
  DSLAM_KF_SEMANTIC: 0
  DSLAM_DIAG: 0
  DSLAM_KF_SWITCH: 1
  DSLAM_KF_MIN_GAP: 10
  DSLAM_KF_SWITCH_GEO: 0.3
  DSLAM_KF_SWITCH_GEO_REL: 0.2
  DSLAM_KF_SWITCH_GEO_KEEP: 150
  DSLAM_KF_SWITCH_GEO_MINCONF: 2
  DSLAM_KF_CAP_BYPASS: 0

baseline: GEOK2_G10
variants:
  GEOK2_G10:           {DSLAM_MAP_FILTER: 0}
  MFD05_both_init1:    {DSLAM_MAP_FILTER: 2, DSLAM_MAP_FILTER_DEPTH: 0.5, DSLAM_MAP_FILTER_SITES: 3, DSLAM_MAP_FILTER_INIT: 1}
  MFD05_both_init0:    {DSLAM_MAP_FILTER: 2, DSLAM_MAP_FILTER_DEPTH: 0.5, DSLAM_MAP_FILTER_SITES: 3, DSLAM_MAP_FILTER_INIT: 0}
  MFD05_track_init0:   {DSLAM_MAP_FILTER: 2, DSLAM_MAP_FILTER_DEPTH: 0.5, DSLAM_MAP_FILTER_SITES: 1, DSLAM_MAP_FILTER_INIT: 0}

sequences:
  - freiburg3_walking_xyz
  - freiburg3_walking_rpy
  - freiburg3_walking_halfsphere
  - freiburg3_walking_static
